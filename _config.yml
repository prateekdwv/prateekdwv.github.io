title: Prateek Dwivedi
description: DAAD PRIME Fellow at Universität des Saarlandes and Université Savoie Mont Blanc, researching computational complexity through algebra.
url: "https://www.prateekdwivedi.in"
baseurl: ""

bluesky_did: "did:plc:y7erwx4j5fxmxafbg3wkhxf3"

timezone: America/Vancouver
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
plugins:
  - jekyll-paginate
paginate: 5
paginate_path: /writing/page:num/
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - scripts
  - tests
  - _diagrams
  - .cache
  - DEVELOPMENT.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules

# GoatCounter; enabled only in production builds.
goatcounter: "https://prateekdwv.goatcounter.com/count"
