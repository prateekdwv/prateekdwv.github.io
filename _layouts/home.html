---
layout: default
---
<div class="md:grid md:min-h-[calc(100svh-var(--site-header-height))] {% if page.show_subscription %}md:grid-rows-[minmax(0,1fr)_auto]{% else %}md:grid-rows-1{% endif %}">
  {% include home-hero.html %}
  {% if page.show_subscription %}
    {% include subscription-banner.html %}
  {% endif %}
</div>

<div class="mx-auto grid box-border w-full max-w-[90rem] items-start gap-12 px-6 py-14 md:grid-cols-[minmax(0,1fr)_minmax(0,2fr)] md:gap-10 md:px-10 lg:gap-16">
  {% include latest-news.html %}
  {% if content != empty %}
    <section id="about" tabindex="-1" aria-labelledby="about-heading" class="min-w-0 w-full max-w-3xl scroll-mt-8 text-lg leading-8 text-black/70">
      <h2 id="about-heading" class="m-0 mb-7 text-2xl font-normal text-black">About me</h2>
      <div class="[&>p:first-child]:mt-0">
        {{ content }}
      </div>
    </section>
  {% endif %}
</div>
