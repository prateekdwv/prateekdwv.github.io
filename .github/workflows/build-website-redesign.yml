name: Build and deploy website

on:
  push:
    branches:
      - website-redesign
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install CSS dependencies
        run: npm ci

      - name: Install diagram tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-pictures texlive-fonts-recommended dvisvgm ghostscript poppler-utils

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check site configuration
        run: bundle exec jekyll doctor

      - name: Cache compiled diagrams
        uses: actions/cache@v4
        with:
          path: .cache/diagrams
          key: diagrams-${{ runner.os }}-${{ hashFiles('_diagrams/**', 'scripts/build_diagrams.rb') }}
          restore-keys: diagrams-${{ runner.os }}-

      - name: Test diagram pipeline
        run: npm run test:diagrams

      - name: Test writing pagination and previews
        run: npm run test:writing

      - name: Build site
        run: npm run build
        env:
          JEKYLL_ENV: production

      - name: Upload built site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
