name: Build website redesign

on:
  push:
    branches:
      - website-redesign

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check site configuration
        run: bundle exec jekyll doctor

      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
